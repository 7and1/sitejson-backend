name: SiteJSON Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-gate:
    name: Backend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: OpenAPI drift check
        run: npm run openapi:check

      - name: Secret scan
        run: npm run security:scan

      - name: Build
        run: npm run build
